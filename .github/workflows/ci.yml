name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run codegen
      - name: Verify generated bindings are committed
        run: git diff --exit-code -- nitrogen
      - run: npm run build
      - run: npm run typecheck:example
      - name: Validate Expo prebuild configuration
        run: npx expo config --type prebuild
        working-directory: example
      - name: Inspect npm package contents
        run: npm pack --dry-run
