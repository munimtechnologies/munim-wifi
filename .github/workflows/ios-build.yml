name: Build iOS

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/ios-build.yml'
      - 'ios/**'
      - 'example/**'
      - 'nitrogen/**'
      - 'src/**'
      - 'app.plugin.js'
      - 'nitro.json'
      - 'package*.json'
      - '*.podspec'
  pull_request:
    paths:
      - '.github/workflows/ios-build.yml'
      - 'ios/**'
      - 'example/**'
      - 'nitrogen/**'
      - 'src/**'
      - 'app.plugin.js'
      - 'nitro.json'
      - 'package*.json'
      - '*.podspec'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run codegen
      - run: npx expo prebuild --clean --platform ios --no-install
        working-directory: example
      - run: pod install
        working-directory: example/ios
      - name: Build iOS example
        run: |
          set -o pipefail
          xcodebuild \
            -workspace MunimWiFiExample.xcworkspace \
            -scheme MunimWiFiExample \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
        working-directory: example/ios
