name: Build Android

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/android-build.yml'
      - 'android/**'
      - 'example/**'
      - 'nitrogen/**'
      - 'src/**'
      - 'app.plugin.js'
      - 'nitro.json'
      - 'package*.json'
  pull_request:
    paths:
      - '.github/workflows/android-build.yml'
      - 'android/**'
      - 'example/**'
      - 'nitrogen/**'
      - 'src/**'
      - 'app.plugin.js'
      - 'nitro.json'
      - 'package*.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17
          cache: gradle
      - run: npm ci
      - run: npm run codegen
      - run: npx expo prebuild --clean --platform android --no-install
        working-directory: example
      - run: ./gradlew :app:assembleDebug --no-daemon --build-cache
        working-directory: example/android
